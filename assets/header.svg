<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#00f3ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F7FA"/>
      <stop offset="70%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#09101f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Badge Border Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Academic Tag Gradient -->
    <linearGradient id="academicTagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F3FF" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00F3FF" flood-opacity="0.9"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.75" stroke-opacity="0.06"/>
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Ambient Spotlights -->
    <radialGradient id="centerAura" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06080D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
    .font-tech {
      font-family: 'Orbitron', 'Space Grotesk', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    }
    .font-sans {
      font-family: 'SF Pro Display', 'Segoe UI', -apple-system, system-ui, sans-serif;
    }
  </style>

  <!-- 1. Background Layers -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="16" fill="url(#dotGrid)"/>
  <rect width="1200" height="340" rx="16" fill="url(#centerAura)"/>

  <!-- Outer Cyber Border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- 2. Cyber Circuit Board Traces & Nodes -->
  <!-- Top Left Circuitry -->
  <path d="M 0 80 L 70 80 L 110 120 L 170 120" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.25"/>
  <path d="M 40 0 L 40 50 L 90 100 L 90 170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="170" cy="120" r="3.5" fill="#00f3ff" filter="url(#nodeGlow)"/>
  <circle cx="170" cy="120" r="1.5" fill="#ffffff"/>
  <circle cx="90" cy="170" r="2.5" fill="#38bdf8" fill-opacity="0.7"/>

  <!-- Top Right Circuitry -->
  <path d="M 1200 80 L 1130 80 L 1090 120 L 1030 120" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.25"/>
  <path d="M 1160 0 L 1160 50 L 1110 100 L 1110 170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1030" cy="120" r="3.5" fill="#00f3ff" filter="url(#nodeGlow)"/>
  <circle cx="1030" cy="120" r="1.5" fill="#ffffff"/>
  <circle cx="1110" cy="170" r="2.5" fill="#38bdf8" fill-opacity="0.7"/>

  <!-- Bottom Left Circuitry -->
  <path d="M 0 260 L 50 260 L 80 230 L 140 230" fill="none" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="140" cy="230" r="2.5" fill="#00f3ff" fill-opacity="0.7"/>

  <!-- Bottom Right Circuitry -->
  <path d="M 1200 260 L 1150 260 L 1120 230 L 1060 230" fill="none" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1060" cy="230" r="2.5" fill="#00f3ff" fill-opacity="0.7"/>

  <!-- 3. Tech HUD Corner Reticles & Technical Notations -->
  <!-- Top Left Reticle -->
  <path d="M 22 52 L 22 22 L 52 22" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <circle cx="28" cy="28" r="2" fill="#00f3ff"/>
  <text x="62" y="32" class="font-mono" font-size="10.5" fill="#00f3ff" letter-spacing="1.5" opacity="0.85">SYS_ID // 0xAFR1D1</text>

  <!-- Top Right Reticle -->
  <path d="M 1178 52 L 1178 22 L 1148 22" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <circle cx="1172" cy="28" r="2" fill="#00f3ff"/>
  <circle cx="1035" cy="30" r="3.5" fill="#10b981" filter="url(#nodeGlow)"/>
  <text x="1046" y="33" class="font-mono" font-size="10.5" fill="#10b981" letter-spacing="1.5" font-weight="600">SECURE // ONLINE</text>

  <!-- Bottom Left Reticle -->
  <path d="M 22 288 L 22 318 L 52 318" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <text x="62" y="316" class="font-mono" font-size="10" fill="#64748B" letter-spacing="1.2">SHA256: 8F2D...C49B</text>

  <!-- Bottom Right Reticle -->
  <path d="M 1178 288 L 1178 318 L 1148 318" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <text x="1138" y="316" text-anchor="end" class="font-mono" font-size="10" fill="#64748B" letter-spacing="1.2">ZERO-TRUST PROTOCOL: ARMED</text>

  <!-- Left Side Cyber Shield Motif -->
  <g transform="translate(105, 148)">
    <!-- Hexagonal Ring -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#0a1324" fill-opacity="0.6" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 3" stroke-opacity="0.5"/>
    <!-- Cyber Shield Icon -->
    <path d="M 0 -16 L 14 -10 L 14 3 C 14 11 7 16 0 19 C -7 16 -14 11 -14 3 L -14 -10 Z" fill="#00f3ff" fill-opacity="0.15" stroke="#00f3ff" stroke-width="1.6" filter="url(#cyanGlow)"/>
    <!-- Digital Core Lock -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    <path d="M 0 3.5 L 0 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Binary Stream -->
    <text x="0" y="49" text-anchor="middle" class="font-mono" font-size="8.5" fill="#00f3ff" opacity="0.6" letter-spacing="1">01000011</text>
  </g>

  <!-- Right Side Cyber Radar / HUD Motif -->
  <g transform="translate(1095, 148)">
    <!-- Concentric Tech Target -->
    <circle cx="0" cy="0" r="34" fill="#0a1324" fill-opacity="0.6" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6 4" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Crosshairs -->
    <line x1="-38" y1="0" x2="-26" y2="0" stroke="#00f3ff" stroke-width="1.5"/>
    <line x1="26" y1="0" x2="38" y2="0" stroke="#00f3ff" stroke-width="1.5"/>
    <line x1="0" y1="-38" x2="0" y2="-26" stroke="#00f3ff" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="0" y2="38" stroke="#00f3ff" stroke-width="1.5"/>
    <!-- Central Node -->
    <circle cx="0" cy="0" r="3" fill="#00f3ff" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    <!-- Telemetry Readout -->
    <text x="0" y="49" text-anchor="middle" class="font-mono" font-size="8.5" fill="#38bdf8" opacity="0.7" letter-spacing="1">PORT: 443/TLS</text>
  </g>

  <!-- 4. Center Content Section -->
  <!-- Top Center Telemetry Tag -->
  <g transform="translate(600, 42)">
    <rect x="-140" y="-13" width="280" height="24" rx="12" fill="#0a1322" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="-120" cy="-1" r="3" fill="#00f3ff" filter="url(#nodeGlow)"/>
    <text x="-108" y="3" class="font-mono" font-size="10" fill="#94A3B8" letter-spacing="1.5">CYBER DEFENSE HUD // V3.8</text>
  </g>

  <!-- Prominent Title: SYED AFRIDI -->
  <!-- Decorative Bracket Accents -->
  <path d="M 330 82 L 310 102 L 310 114 L 330 134" fill="none" stroke="#00f3ff" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 870 82 L 890 102 L 890 114 L 870 134" fill="none" stroke="#00f3ff" stroke-width="2" stroke-opacity="0.6"/>

  <text x="600" y="118" text-anchor="middle" class="font-tech" font-size="52" font-weight="900" letter-spacing="8" fill="url(#titleGrad)" filter="url(#cyanGlow)">
    SYED AFRIDI
  </text>

  <!-- Glowing Horizontal Divider -->
  <line x1="380" y1="134" x2="820" y2="134" stroke="url(#glowLineGrad)" stroke-width="2"/>
  <circle cx="600" cy="134" r="3" fill="#ffffff" filter="url(#cyanGlow)"/>

  <!-- Subtitle -->
  <text x="600" y="164" text-anchor="middle" class="font-mono" font-size="15" font-weight="700" letter-spacing="3.5" fill="#38BDF8" filter="url(#subtleGlow)">
    BCA CYBERSECURITY STUDENT &amp; FULL-STACK DEVELOPER
  </text>

  <!-- Academic Tag Pill -->
  <g transform="translate(600, 196)">
    <rect x="-175" y="-14" width="350" height="28" rx="14" fill="url(#academicTagBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
    <text x="0" y="4.5" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.8">
      🏛️ Sona College of Arts and Science
    </text>
  </g>

  <!-- 5. Pill Badges Row -->
  <!-- Badge 1: 🛡️ System Security -->
  <g transform="translate(70, 254)">
    <rect width="190" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="178" y2="1" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="95" y="25" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#F1F5F9" letter-spacing="0.3">
      🛡️ System Security
    </text>
  </g>

  <!-- Badge 2: ⚔️ Offensive & Defensive Concepts -->
  <g transform="translate(280, 254)">
    <rect width="325" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="313" y2="1" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="162" y="25" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#F1F5F9" letter-spacing="0.3">
      ⚔️ Offensive &amp; Defensive Concepts
    </text>
  </g>

  <!-- Badge 3: ⚡ Resilient Web Architectures -->
  <g transform="translate(625, 254)">
    <rect width="305" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="293" y2="1" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="152" y="25" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#F1F5F9" letter-spacing="0.3">
      ⚡ Resilient Web Architectures
    </text>
  </g>

  <!-- Badge 4: 🐧 Linux & Docker -->
  <g transform="translate(950, 254)">
    <rect width="180" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="168" y2="1" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="90" y="25" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#F1F5F9" letter-spacing="0.3">
      🐧 Linux &amp; Docker
    </text>
  </g>
</svg>
