<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Outer Frame Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Center Spotlight -->
    <radialGradient id="centerAura" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C15" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Typography Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F0F9FF"/>
      <stop offset="70%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Center Glowing Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Container Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#09101D" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Badge Card Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1527" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#080D18" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Badge Card Border Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Badge Top Accent Line Gradient -->
    <linearGradient id="badgeTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.045"/>
    </pattern>

    <!-- Secondary Dot Matrix Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#38BDF8" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
    }
    .font-tech {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .font-sans {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    ]]>
  </style>

  <!-- 1. Background Layers -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dotGrid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#centerAura)"/>

  <!-- Outer Cyber Border Frame -->
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- 2. Circuitry Traces & Junction Nodes -->
  <!-- Top-Left Circuit Traces -->
  <path d="M 0 65 L 55 65 L 90 100 L 140 100" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.22"/>
  <path d="M 35 0 L 35 45 L 70 80 L 70 135" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="140" cy="100" r="3" fill="#38BDF8" filter="url(#nodeGlow)"/>
  <circle cx="140" cy="100" r="1.3" fill="#FFFFFF"/>
  <circle cx="70" cy="135" r="2.2" fill="#0284C7" fill-opacity="0.7"/>

  <!-- Top-Right Circuit Traces -->
  <path d="M 1200 65 L 1145 65 L 1110 100 L 1060 100" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.22"/>
  <path d="M 1165 0 L 1165 45 L 1130 80 L 1130 135" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1060" cy="100" r="3" fill="#38BDF8" filter="url(#nodeGlow)"/>
  <circle cx="1060" cy="100" r="1.3" fill="#FFFFFF"/>
  <circle cx="1130" cy="135" r="2.2" fill="#0284C7" fill-opacity="0.7"/>

  <!-- 3. Tech HUD Corner Reticles -->
  <!-- Top Left Reticle & Sys Label -->
  <path d="M 24 38 L 24 20 L 42 20" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="24" r="1.5" fill="#38BDF8"/>
  <text x="50" y="27" class="font-mono" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
    SYSTEM // <tspan fill="#38BDF8">0xAFR1D1</tspan>
  </text>

  <!-- Top Right Reticle & Status Indicator -->
  <path d="M 1176 38 L 1176 20 L 1158 20" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1172" cy="24" r="1.5" fill="#38BDF8"/>
  <circle cx="1040" cy="24" r="3.2" fill="#38BDF8" filter="url(#nodeGlow)"/>
  <circle cx="1040" cy="24" r="1.3" fill="#FFFFFF"/>
  <text x="1052" y="27" class="font-mono" font-size="9.5" font-weight="600" fill="#38BDF8" letter-spacing="1.2">
    STATUS: BUILDING &amp; SCALING
  </text>

  <!-- Bottom Left Reticle & Geo Tag -->
  <path d="M 24 262 L 24 280 L 42 280" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="278" class="font-mono" font-size="9" fill="#475569" letter-spacing="1.2">
    LOC // TAMIL NADU, INDIA
  </text>

  <!-- Bottom Right Reticle & Security Tag -->
  <path d="M 1176 262 L 1176 280 L 1158 280" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <text x="1150" y="278" text-anchor="end" class="font-mono" font-size="9" fill="#475569" letter-spacing="1.2">
    ZERO-TRUST ARCHITECTURE // 2026
  </text>

  <!-- 4. Flanking Cyber Motifs -->
  <!-- Left Cyber Shield Emblem -->
  <g transform="translate(95, 140)">
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0B1322" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <path d="M 0 -11 L 10 -6 L 10 2 C 10 8 5 12 0 14 C -5 12 -10 8 -10 2 L -10 -6 Z" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="0" cy="2" r="2.2" fill="#FFFFFF"/>
    <text x="0" y="36" text-anchor="middle" class="font-mono" font-size="8" fill="#38BDF8" opacity="0.65" letter-spacing="1">SEC // NODE</text>
  </g>

  <!-- Right Cyber Radar / HUD Target -->
  <g transform="translate(1105, 140)">
    <circle cx="0" cy="0" r="24" fill="#0B1322" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="4 3" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="-28" y1="0" x2="-20" y2="0" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="0" y1="-28" x2="0" y2="-20" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#38BDF8" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
    <text x="0" y="36" text-anchor="middle" class="font-mono" font-size="8" fill="#38BDF8" opacity="0.65" letter-spacing="1">TLS // ACTIVE</text>
  </g>

  <!-- 5. Center Top Capsule -->
  <g transform="translate(600, 35)">
    <rect x="-115" y="-11" width="230" height="22" rx="11" fill="#0B1322" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.45"/>
    <circle cx="-85" cy="0" r="2.5" fill="#38BDF8"/>
    <text x="0" y="3.5" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="1.6">
      DEV PORTFOLIO // V2.0
    </text>
    <circle cx="85" cy="0" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- 6. Main Title: SYED AFRIDI -->
  <!-- Flanking Tech Brackets -->
  <path d="M 370 66 L 354 80 L 354 88 L 370 102" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.55"/>
  <path d="M 830 66 L 846 80 L 846 88 L 830 102" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.55"/>

  <text x="600" y="90" text-anchor="middle" class="font-tech" font-size="46" font-weight="900" letter-spacing="6" fill="url(#titleGrad)" filter="url(#titleGlow)">
    SYED AFRIDI
  </text>

  <!-- Glowing Center Divider Line -->
  <line x1="420" y1="106" x2="780" y2="106" stroke="url(#dividerGrad)" stroke-width="1.6"/>
  <circle cx="600" cy="106" r="2.5" fill="#FFFFFF" filter="url(#subtleGlow)"/>

  <!-- 7. Subtitle -->
  <text x="600" y="132" text-anchor="middle" class="font-tech" font-size="15" font-weight="600" letter-spacing="2.2" fill="#38BDF8" filter="url(#subtleGlow)">
    Software Developer Intern &amp; BCA Cybersecurity Student
  </text>

  <!-- 8. Academic / Work Pill -->
  <g transform="translate(600, 166)">
    <rect x="-275" y="-15" width="550" height="30" rx="15" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1.2"/>
    <text x="0" y="4.5" text-anchor="middle" class="font-sans" font-size="12.2" font-weight="500" fill="#E2E8F0" letter-spacing="0.5">
      🏛️ Sona Incubation Foundation &#8226; Sona College of Arts and Science
    </text>
  </g>

  <!-- 9. Key Highlight Tags / Badges Row -->
  <!-- Badge 1: Edgyy & AXYE Store -->
  <g transform="translate(54, 212)">
    <rect width="258" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="242" y2="1" stroke="url(#badgeTopLine)" stroke-width="1.2"/>
    <text x="129" y="25" text-anchor="middle" class="font-sans" font-size="11.8" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">
      🚀 Edgyy (edgyy.in) &amp; AXYE Store
    </text>
  </g>

  <!-- Badge 2: Linux & Python Systems -->
  <g transform="translate(336, 212)">
    <rect width="258" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="242" y2="1" stroke="url(#badgeTopLine)" stroke-width="1.2"/>
    <text x="129" y="25" text-anchor="middle" class="font-sans" font-size="11.8" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">
      🐧 Linux &amp; Python Systems
    </text>
  </g>

  <!-- Badge 3: Full-Stack & SaaS Platforms -->
  <g transform="translate(606, 212)">
    <rect width="258" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="242" y2="1" stroke="url(#badgeTopLine)" stroke-width="1.2"/>
    <text x="129" y="25" text-anchor="middle" class="font-sans" font-size="11.8" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">
      ⚡ Full-Stack &amp; SaaS Platforms
    </text>
  </g>

  <!-- Badge 4: Problem Solving & Aptitude -->
  <g transform="translate(888, 212)">
    <rect width="258" height="40" rx="8" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="242" y2="1" stroke="url(#badgeTopLine)" stroke-width="1.2"/>
    <text x="129" y="25" text-anchor="middle" class="font-sans" font-size="11.8" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">
      🧠 Problem Solving &amp; Aptitude
    </text>
  </g>
</svg>
