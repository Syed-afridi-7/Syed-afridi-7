<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" fill="none">
  <defs>
    <!-- Dark Cyber Container Gradient -->
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Neon Cyan & Cobalt Border Glow -->
    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="cardGlow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f3ff" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#3b82f6" flood-opacity="0.6"/>
    </filter>

    <filter id="cyanNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f3ff" flood-opacity="0.8"/>
    </filter>

    <!-- Subtle Tech Pattern -->
    <pattern id="terminalGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
    }
  </style>

  <!-- Outer Glow & Base Card -->
  <rect x="4" y="4" width="892" height="172" rx="12" fill="url(#quoteBg)" filter="url(#cardGlow)"/>
  <rect x="4" y="4" width="892" height="172" rx="12" fill="url(#terminalGrid)"/>
  <rect x="4.5" y="4.5" width="891" height="171" rx="11.5" fill="none" stroke="url(#quoteBorder)" stroke-width="1.4"/>

  <!-- Top Terminal Window Bar -->
  <rect x="5" y="5" width="890" height="34" rx="11" fill="#09101d" fill-opacity="0.95"/>
  <rect x="5" y="26" width="890" height="13" fill="#09101d" fill-opacity="0.95"/>

  <!-- Terminal Window Controls (Traffic Lights) -->
  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="46" cy="22" r="5" fill="#eab308"/>
  <circle cx="64" cy="22" r="5" fill="#22c55e"/>

  <!-- Terminal Title -->
  <g transform="translate(100, 22)">
    <path d="M -8 -1 L -8 -4 C -8 -6 -5 -7 -3 -7 C -1 -7 2 -6 2 -4 L 2 -1 M -9 -1 L 3 -1 L 3 6 L -9 6 Z" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="10" y="3.5" class="font-mono" font-size="11" fill="#94A3B8" letter-spacing="1">sysadmin@afridi: ~/philosophy.sh</text>
  </g>

  <!-- Right Status -->
  <text x="872" y="25" text-anchor="end" class="font-mono" font-size="10" fill="#00f3ff" letter-spacing="1.2" opacity="0.9">
    ● SESSION: SECURE [MUTUAL-TLS]
  </text>

  <!-- Header Separator Line -->
  <line x1="5" y1="39" x2="895" y2="39" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Terminal Prompt Line: sysadmin@afridi:~$ cat philosophy.txt -->
  <text x="32" y="68" class="font-mono" font-size="13.5">
    <tspan fill="#10B981" font-weight="700">sysadmin@afridi</tspan><tspan fill="#64748B">:</tspan><tspan fill="#38BDF8" font-weight="700">~</tspan><tspan fill="#F1F5F9" font-weight="700">$ </tspan><tspan fill="#00F3FF" font-weight="600">cat philosophy.txt</tspan>
  </text>

  <!-- Blinking Cursor -->
  <rect x="330" y="55" width="8" height="15" fill="#00F3FF" opacity="0.85" rx="1">
    <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Quote Lines -->
  <!-- "Security is not an afterthought, it is the foundation of resilient engineering. Code with clarity, defend with precision." -->
  <text x="32" y="103" class="font-mono" font-size="14.5" fill="#E2E8F0" font-weight="500" letter-spacing="0.3">
    <tspan fill="#00F3FF" font-weight="700">“</tspan>Security is not an afterthought, it is the foundation of <tspan fill="#38BDF8" font-weight="700">resilient engineering</tspan>.
  </text>
  <text x="32" y="127" class="font-mono" font-size="14.5" fill="#E2E8F0" font-weight="500" letter-spacing="0.3">
    Code with <tspan fill="#00F3FF" font-weight="600">clarity</tspan>, defend with <tspan fill="#00F3FF" font-weight="600">precision</tspan>.<tspan fill="#00F3FF" font-weight="700">”</tspan>
  </text>

  <!-- Bottom Details & Author -->
  <line x1="32" y1="146" x2="868" y2="146" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>

  <text x="32" y="162" class="font-mono" font-size="10.5" fill="#475569" letter-spacing="1">
    // INTEGRITY CHECK: SHA-256 VALIDATED
  </text>

  <text x="868" y="162" text-anchor="end" class="font-mono" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1" filter="url(#cyanNeon)">
    - Syed Afridi
  </text>
</svg>
